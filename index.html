<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0d3b30">
  <link rel="canonical" href="https://cairngps.matthieu.app/">

  <link rel="alternate" hreflang="en" href="https://cairngps.matthieu.app/en/">

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icons/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Link previews: social crawlers read this page without running the redirect below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CairnGPS">
  <meta property="og:title" content="CairnGPS – Know where your GPS signal comes from">

  <script>
    // Language picked in the switcher first, then the browser's; English otherwise.
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'fr' && lang !== 'en') {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = nav.toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
      }
      location.replace(lang + '/');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d3b30; color: #f3ebdd; font-family: system-ui, sans-serif; text-align: center; }
    main { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #cad6cc; }
    nav { display: flex; gap: 24px; font-size: 18px; }
    a { color: #f3ebdd; }
  </style>
</head>
<body>
  <main>
    <img src="assets/img/icons/icon-96.png" alt="" width="72" height="72">

    <p>GNSS receiver &amp; hiking logbook for Android · <span lang="fr">Récepteur GNSS &amp; carnet de randonnée pour Android</span></p>
    <nav aria-label="Language / Langue">
      <a href="fr/" hreflang="fr" lang="fr">Français</a>
      <a href="en/" hreflang="en">English</a>
    </nav>
  </main>
</body>
</html>
