server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    charset_types text/css text/plain text/xml application/javascript application/manifest+json;

    # Behind Traefik: keep redirects (/fr -> /fr/) relative, so they don't point to http://host:80.
    absolute_redirect off;

    # One URL per page for search engines: /fr/index.html -> /fr/. Matched on the original
    # request, so the internal `index` lookup doesn't loop.
    if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # HTML is revalidated on every visit so a deploy shows up right away.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Not in nginx's default MIME table.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # CSS and JS are versioned with ?v=, fonts and images never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;
}
