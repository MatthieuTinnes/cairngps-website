server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Behind Traefik: keep redirects (/fr -> /fr/) relative, so they don't point to http://host:80.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # HTML is revalidated on every visit so a deploy shows up right away.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # CSS and JS are versioned with ?v=, fonts and images never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;
}
